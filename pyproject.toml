[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipcheck"
version = "0.1.0"
description = "A dependency-free CLI that checks whether a repository is ready to ship as open source."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "ShipCheck contributors"}]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
shipcheck = "shipcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
